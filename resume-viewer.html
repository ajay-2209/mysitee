<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajay V — Resume</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      font-family: Arial, sans-serif;
      background: #f2f3f5;
      color: #172033;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .viewer {
      flex: 1;
      min-height: 0;
      padding-bottom: 76px;
    }
    .viewer iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 76px);
      border: 0;
      background: #e5e7eb;
    }
    .download-bar {
      position: fixed;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      background: rgba(255,255,255,.97);
      border-top: 1px solid #d8dce3;
      box-shadow: 0 -4px 18px rgba(20, 30, 50, .08);
    }
    .download-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 12px 24px;
      border-radius: 10px;
      background: #172033;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .download-button:hover { background: #2b3a55; }
    .download-button:focus-visible { outline: 3px solid #7aa7ff; outline-offset: 3px; }
    @media (max-width: 600px) {
      .download-bar { min-height: 70px; padding: 10px 14px; }
      .viewer iframe { height: calc(100vh - 70px); }
      .download-button { width: 100%; max-width: 420px; }
    }
  </style>
</head>
<body>
  <main class="viewer" aria-label="Resume PDF preview">
    <iframe src="resume.pdf#toolbar=1&navpanes=0" title="Ajay V resume PDF">
      Your browser cannot display PDFs inline.
      <a href="resume.pdf">Open the resume PDF</a>.
    </iframe>
  </main>
  <footer class="download-bar">
    <a class="download-button" href="resume.pdf" download="Ajay_V_Resume.pdf" rel="noopener">
      <span aria-hidden="true">↓</span> Download Resume PDF
    </a>
  </footer>
</body>
</html>
